:host {
  all: initial;
  display: block;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  --lcp-accent: #6366f1;
  --lcp-background: #0f1115;
  --lcp-surface: #171a21;
  --lcp-border: rgba(255, 255, 255, 0.12);
  --lcp-text: #e7e9ee;
  --lcp-muted: #8b93a1;
  --lcp-radius: 10px;
  --lcp-danger: #ef4444;
  --lcp-success: #22c55e;
}

.lcp-root, .lcp-root * , .lcp-root *::before, .lcp-root *::after {
  box-sizing: border-box;
}

.lcp-root {
  font-family: inherit;
  font-size: 14px;
  line-height: 1.5;
  color: var(--lcp-text);
  background: var(--lcp-background);
  border: 1px solid var(--lcp-border);
  border-radius: var(--lcp-radius);
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  height: 480px;
  min-height: 200px;
  isolation: isolate;
}

.lcp-root[data-preview-hidden="true"] {
  grid-template-columns: minmax(0, 1fr);
}

.lcp-panel {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--lcp-background);
}

.lcp-editor-panel {
  border-right: 1px solid var(--lcp-border);
}

.lcp-root[data-preview-hidden="true"] .lcp-editor-panel {
  border-right: none;
}

.lcp-tabs {
  display: flex;
  gap: 2px;
  padding: 6px 6px 0;
  background: var(--lcp-surface);
  border-bottom: 1px solid var(--lcp-border);
  flex-shrink: 0;
  overflow-x: auto;
}

.lcp-tab {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--lcp-muted);
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  padding: 8px 14px;
  border-radius: 6px 6px 0 0;
  cursor: pointer;
  transition: color 0.15s ease, background-color 0.15s ease;
}

.lcp-tab:hover {
  color: var(--lcp-text);
}

.lcp-tab[aria-selected="true"] {
  color: var(--lcp-text);
  background: var(--lcp-background);
  box-shadow: inset 0 -2px 0 var(--lcp-accent);
}

.lcp-tab:focus-visible {
  outline: 2px solid var(--lcp-accent);
  outline-offset: -2px;
}

.lcp-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  background: var(--lcp-surface);
  border-bottom: 1px solid var(--lcp-border);
  flex-shrink: 0;
}

.lcp-toolbar-actions {
  display: flex;
  gap: 8px;
}

.lcp-btn {
  appearance: none;
  border: 1px solid var(--lcp-border);
  background: var(--lcp-background);
  color: var(--lcp-text);
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: transform 0.08s ease, filter 0.15s ease;
}

.lcp-btn:hover {
  filter: brightness(1.15);
}

.lcp-btn:active {
  transform: scale(0.97);
}

.lcp-btn:focus-visible {
  outline: 2px solid var(--lcp-accent);
  outline-offset: 1px;
}

.lcp-btn-run {
  background: var(--lcp-accent);
  border-color: transparent;
  color: white;
}

.lcp-status {
  font-size: 11.5px;
  color: var(--lcp-muted);
  white-space: nowrap;
}

.lcp-editor-wrap {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
}

.lcp-editor {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  resize: none;
  border: none;
  outline: none;
  padding: 14px 16px;
  background: var(--lcp-background);
  color: var(--lcp-text);
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 14px;
  line-height: 1.6;
  tab-size: 2;
  display: none;
}

.lcp-editor[data-active="true"] {
  display: block;
}

.lcp-editor:disabled {
  opacity: 0.75;
  cursor: not-allowed;
}

.lcp-console {
  flex-shrink: 0;
  max-height: 34%;
  min-height: 90px;
  border-top: 1px solid var(--lcp-border);
  background: var(--lcp-surface);
  display: flex;
  flex-direction: column;
}

.lcp-console-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--lcp-muted);
  border-bottom: 1px solid var(--lcp-border);
  flex-shrink: 0;
}

.lcp-console-clear {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--lcp-muted);
  font: inherit;
  font-size: 11px;
  cursor: pointer;
  text-decoration: underline;
}

.lcp-console-body {
  overflow-y: auto;
  padding: 4px 12px 8px;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12.5px;
}

.lcp-console-line {
  padding: 3px 0;
  border-bottom: 1px dashed var(--lcp-border);
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--lcp-text);
}

.lcp-console-line:last-child {
  border-bottom: none;
}

.lcp-console-line[data-level="error"] {
  color: var(--lcp-danger);
}

.lcp-console-line[data-level="warn"] {
  color: #f59e0b;
}

.lcp-console-line[data-level="info"] {
  color: #38bdf8;
}

.lcp-console-empty {
  color: var(--lcp-muted);
  font-style: italic;
  padding: 6px 0;
}

.lcp-preview-panel {
  background: white;
}

.lcp-preview {
  flex: 1 1 auto;
  width: 100%;
  height: 100%;
  border: none;
  background: white;
  display: block;
}

.lcp-visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

  <body>
    <div id="root"></div>

    <!-- ================= زر التنقل السريع والزر العائم ================= -->
    <div style="text-align: center; margin: 30px 0;">
      <a href="#test-and-buy" class="scroll-hero-btn">
        <span class="pulse-dot"></span>
        <span>Live Demo & License ($29)</span>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M19 12l-7 7-7-7"/>
        </svg>
      </a>
    </div>

    <a href="#test-and-buy" class="floating-quick-pill" title="Jump to Demo & Purchase">
      <span class="pill-badge">🧪 Test & Buy ($29)</span>
      <svg class="arrow-icon-mini" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M19 12l-7 7-7-7"/>
      </svg>
    </a>

    <!-- ================= Dual Action Hero / Pricing Bar ================= -->
    <div id="test-and-buy" class="action-cta-container">
      <div class="action-card-inner">
        
        <div class="action-text-info">
          <span class="status-pill">● Ready for Production</span>
          <h3 class="action-title">Try it in action or get full access</h3>
          <p class="action-subtitle">Test the isolated Shadow-DOM sandbox or unlock the lifetime developer license.</p>
        </div>

        <!-- مجموعة الأزرار المتناسقة جنباً إلى جنب -->
        <div class="action-buttons-group">
          
          <!-- 1. زر التست التجريبي (Live Test) -->
          <a href="https://live-code-widge.vercel.app/embed-test.html" target="_blank" rel="noopener noreferrer" class="btn-action btn-test">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 2v7.31"></path>
              <path d="M14 9.3V1.99"></path>
              <path d="M8.5 2h7"></path>
              <path d="M14 9.3a6.5 6.5 0 1 1-4 0"></path>
              <path d="M5.52 16h12.96"></path>
            </svg>
            <span>Live Test Demo</span>
            <span class="btn-tag">Free</span>
          </a>

          <!-- 2. زر الشراء والدفع (Buy License) -->
          <button id="buy-btn" class="btn-action btn-buy">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            <span id="btn-text">Buy License ($29)</span>
            <span id="btn-spinner" class="spinner" style="display: none;"></span>
          </button>

        </div>

        <!-- رسالة خطأ تظهر في حال تعطل سيرفر الدفع -->
        <div id="checkout-error" class="error-banner" style="display: none;"></div>

        <!-- أشرطة الثقة السريعة -->
        <div class="trust-micro-bar">
          <span>🔒 Instant Key via Stripe</span>
          <span>•</span>
          <span>⚡ Zero Framework Overheads</span>
          <span>•</span>
          <span>🚀 Lifetime Updates</span>
        </div>

      </div>
    </div>

    <!-- ================= التنسيقات (CSS) ================= -->
    <style>
      /* تفعيل النزول الانسيابي والناعم في كامل الصفحة */
      html {
        scroll-behavior: smooth;
      }

      /* 1. تنسيق زر أعلى الصفحة */
      .scroll-hero-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: #0f172a;
        color: #ffffff;
        padding: 12px 24px;
        border-radius: 9999px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        font-family: system-ui, -apple-system, sans-serif;
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.15);
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .scroll-hero-btn:hover {
        background: #4f46e5;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(79, 70, 229, 0.35);
      }

      .pulse-dot {
        width: 8px;
        height: 8px;
        background-color: #22c55e;
        border-radius: 50%;
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
        animation: pulse 1.8s infinite;
      }

      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
        70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
        100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
      }

      .floating-quick-pill {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 10px 18px;
        border-radius: 9999px;
        text-decoration: none;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 600;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        transition: all 0.2s ease;
      }

      .floating-quick-pill:hover {
        background: #4f46e5;
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 12px 25px rgba(79, 70, 229, 0.4);
      }

      .arrow-icon {
        width: 18px;
        height: 18px;
        animation: bounce 1.5s infinite;
      }

      .arrow-icon-mini {
        width: 14px;
        height: 14px;
        animation: bounce 1.5s infinite;
      }

      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(3px); }
      }

      .action-cta-container {
        max-width: 860px;
        margin: 40px auto;
        padding: 0 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }

      .action-card-inner {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 36px 32px;
        text-align: center;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
        position: relative;
        box-sizing: border-box;
      }

      .status-pill {
        display: inline-block;
        background: #ecfdf5;
        color: #059669;
        font-size: 12px;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 9999px;
        margin-bottom: 12px;
        letter-spacing: 0.02em;
      }

      .action-title {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 800;
        color: #0f172a;
        letter-spacing: -0.02em;
      }

      .action-subtitle {
        margin: 0 0 28px;
        font-size: 15px;
        color: #64748b;
      }

      .action-buttons-group {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .btn-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 48px;
        padding: 0 24px;
        font-size: 15px;
        font-weight: 600;
        border-radius: 10px;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        box-sizing: border-box;
        white-space: nowrap;
      }

      .btn-icon {

    <!-- ================= الجافاسكربت الخاص بالدفع والتنقل ================= -->
    <script>
      const BACKEND_URL = 'http://localhost:4000'; // عدله عند الرفع للإنتاج

      // منطق الدفع
      const buyBtn = document.getElementById('buy-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');
      const errorBanner = document.getElementById('checkout-error');

      buyBtn.addEventListener('click', async () => {
        buyBtn.disabled = true;
        btnText.textContent = 'Opening Checkout...';
        btnSpinner.style.display = 'inline-block';
        errorBanner.style.display = 'none';

        try {
          const response = await fetch(`${BACKEND_URL}/create-checkout-session`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
          });

          if (!response.ok) throw new Error(`Server status: ${response.status}`);

          const data = await response.json();
          if (data.url) {
            window.location.href = data.url;
          } else {
            throw new Error(data.error || 'Failed to initialize checkout');
          }
        } catch (err) {
          console.error('Checkout error:', err);
          errorBanner.textContent = '⚠️ Could not connect to payment server. Check if localhost:4000 is active.';
          errorBanner.style.display = 'block';
          buyBtn.disabled = false;
          btnText.textContent = 'Buy License ($29)';
          btnSpinner.style.display = 'none';
        }
      });

      // منطق التنقل السلس
      document.querySelectorAll('a[href="#test-and-buy"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
          e.preventDefault();
          const target = document.getElementById('test-and-buy');
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        });
      });
    </script>
